<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha - Portal GMV</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="brand">
          <img src="/img/logo.jpg" alt="GMV" />
        </div>

        <h1>Redefinir senha</h1>
        <p>Enviaremos um link para o e-mail cadastrado.</p>

        <form id="redefinicaoForm">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email" required />

          <button type="submit">Enviar link</button>
        </form>

        <div class="auth-links">
          <a href="/login">Voltar para o login</a>
        </div>

        <p id="mensagem" class="message" aria-live="polite"></p>
      </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/esqueci-senha.js"></script>
  </body>
</html>
