<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Usuários - Portal GMV</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="content">
      <header class="page-header">
        <div>
          <h2>Cadastro de Usuários</h2>
          <p>Aprove solicitações e gerencie perfis e vínculos.</p>
        </div>
      </header>

      <section class="panel filters-panel usuarios-filters">
        <input
          id="buscaInput"
          type="text"
          placeholder="Buscar por nome ou e-mail"
        />

        <select id="perfilFiltro">
          <option value="">Todos os perfis</option>
        </select>

        <select id="statusFiltro">
          <option value="">Todos os cadastros</option>
          <option value="AGUARDANDO_APROVACAO">Aguardando aprovação</option>
          <option value="APROVADO">Aprovado</option>
          <option value="REJEITADO">Rejeitado</option>
          <option value="BLOQUEADO">Bloqueado</option>
        </select>

        <select id="ativoFiltro">
          <option value="">Ativos e inativos</option>
          <option value="true">Ativo</option>
          <option value="false">Inativo</option>
        </select>

        <button id="filtrarButton" type="button">Filtrar</button>
      </section>

      <p id="paginaMensagem" class="message" aria-live="polite"></p>

      <section class="panel usuarios-table-panel">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Perfil</th>
              <th>Shopping</th>
              <th>Cadastro</th>
              <th>Acesso</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="usuariosTableBody">
            <tr>
              <td colspan="7">Carregando...</td>
            </tr>
          </tbody>
        </table>

        <div class="pagination">
          <button id="paginaAnteriorButton" type="button">Anterior</button>
          <span id="paginaInfo">Página 1</span>
          <button id="proximaPaginaButton" type="button">Próxima</button>
        </div>
      </section>
    </main>

    <div id="usuarioModal" class="modal" hidden>
      <div class="modal-content">
        <header class="modal-header">
          <h3>Editar usuário</h3>
          <button id="fecharModalButton" type="button">Fechar</button>
        </header>

        <form id="usuarioForm">
          <input id="usuarioIdInput" type="hidden" />

          <label for="nomeInput">Nome</label>
          <input id="nomeInput" type="text" required />

          <label for="emailInput">E-mail</label>
          <input id="emailInput" type="email" required />

          <label for="perfilInput">Perfil</label>
          <select id="perfilInput" required>
            <option value="">Selecione</option>
          </select>

          <label for="ativoInput">Acesso</label>
          <select id="ativoInput">
            <option value="true">Ativo</option>
            <option value="false">Inativo</option>
          </select>

          <div id="edicaoShoppingsGroup">
            <label for="shoppingsInput">Shoppings permitidos</label>
            <select id="shoppingsInput" multiple size="6"></select>
          </div>

          <button type="submit">Atualizar usuário</button>
          <p id="usuarioMensagem" class="message" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <div id="aprovacaoModal" class="modal" hidden>
      <div class="modal-content">
        <header class="modal-header">
          <h3>Aprovar solicitação</h3>
          <button id="fecharAprovacaoButton" type="button">Fechar</button>
        </header>

        <form id="aprovacaoForm">
          <input id="aprovacaoUsuarioId" type="hidden" />
          <p id="aprovacaoUsuarioResumo"></p>

          <label for="aprovacaoPerfilInput">Perfil concedido</label>
          <select id="aprovacaoPerfilInput" required>
            <option value="">Selecione</option>
          </select>

          <div id="aprovacaoShoppingsGroup" hidden>
            <label for="aprovacaoShoppingsInput">Shoppings permitidos</label>
            <select
              id="aprovacaoShoppingsInput"
              multiple
              size="6"
            ></select>
          </div>

          <button type="submit">Confirmar aprovação</button>
          <p id="aprovacaoMensagem" class="message" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <div id="rejeicaoModal" class="modal" hidden>
      <div class="modal-content">
        <header class="modal-header">
          <h3>Rejeitar solicitação</h3>
          <button id="fecharRejeicaoButton" type="button">Fechar</button>
        </header>

        <form id="rejeicaoForm">
          <input id="rejeicaoUsuarioId" type="hidden" />

          <label for="motivoRejeicaoInput">Motivo da rejeição</label>
          <textarea
            id="motivoRejeicaoInput"
            minlength="5"
            maxlength="1000"
            required
          ></textarea>

          <button type="submit" class="danger-action">
            Confirmar rejeição
          </button>
          <p id="rejeicaoMensagem" class="message" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/pages/usuarios.js"></script>
  </body>
</html>
