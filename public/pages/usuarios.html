<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Usuários - Portal GMV</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <aside id="sidebar" class="sidebar"></aside>

    <main class="content">
      <header class="page-header">
        <div>
          <h2>Cadastro de Usuários</h2>
          <p>Gerencie usuários, perfis e shoppings permitidos.</p>
        </div>

        <button id="novoUsuarioButton" class="primary-action" type="button">
          Novo Usuário
        </button>
      </header>

      <section class="panel filters-panel">
        <input id="buscaInput" type="text" placeholder="Buscar por nome ou e-mail" />

        <select id="perfilFiltro">
          <option value="">Todos os perfis</option>
        </select>

        <select id="ativoFiltro">
          <option value="">Todos os status</option>
          <option value="true">Ativo</option>
          <option value="false">Inativo</option>
        </select>

        <button id="filtrarButton" type="button">Filtrar</button>
      </section>

      <section class="panel">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Perfil</th>
              <th>Shoppings</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="usuariosTableBody">
            <tr>
              <td colspan="6">Carregando...</td>
            </tr>
          </tbody>
        </table>

        <div class="pagination">
          <button id="paginaAnteriorButton" type="button">Anterior</button>
          <span id="paginaInfo">Página 1</span>
          <button id="proximaPaginaButton" type="button">Próxima</button>
        </div>
      </section>
    </main>

    <div id="usuarioModal" class="modal" hidden>
      <div class="modal-content">
        <header class="modal-header">
          <h3 id="usuarioModalTitulo">Novo Usuário</h3>
          <button id="fecharModalButton" type="button">Fechar</button>
        </header>

        <form id="usuarioForm">
          <input id="usuarioIdInput" type="hidden" />

          <label for="nomeInput">Nome</label>
          <input id="nomeInput" type="text" required />

          <label for="emailInput">E-mail</label>
          <input id="emailInput" type="email" required />

          <label for="senhaInput">Senha</label>
          <input id="senhaInput" type="password" required />

          <label for="perfilInput">Perfil</label>
          <select id="perfilInput" required>
            <option value="">Selecione</option>
          </select>

          <label for="ativoInput">Status</label>
          <select id="ativoInput">
            <option value="true">Ativo</option>
            <option value="false">Inativo</option>
          </select>

          <label for="shoppingsInput">Shoppings atribuídos e permitidos</label>
          <select id="shoppingsInput" multiple size="6"></select>

          <button id="salvarUsuarioButton" type="submit">Salvar Usuário</button>
          <p id="usuarioMensagem" class="message"></p>
        </form>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/pages/usuarios.js"></script>
  </body>
</html>
